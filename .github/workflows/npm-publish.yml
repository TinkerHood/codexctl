name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release version (without v); defaults to Cargo.toml.'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  queue: max
  cancel-in-progress: false

jobs:
  get-version:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version and require a published release
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ]; then VERSION="$INPUT_VERSION"; fi
          if [ -z "$VERSION" ]; then
            VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable release version'; exit 1; }
          gh release view "v$VERSION" --json isDraft --jq 'if .isDraft then error("Release is still a draft") else . end' >/dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  publish-platforms:
    name: Publish platform packages
    runs-on: ubuntu-latest
    needs: get-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            asset: codexctl-x86_64-unknown-linux-gnu.tar.gz
          - platform: linux-arm64
            asset: codexctl-aarch64-unknown-linux-gnu.tar.gz
          - platform: darwin-x64
            asset: codexctl-x86_64-apple-darwin.tar.gz
          - platform: darwin-arm64
            asset: codexctl-aarch64-apple-darwin.tar.gz
          - platform: win32-x64
            asset: codexctl-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.get-version.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/setup@v1
        with:
          version: 12.5.1
          install: false
      - name: Download and verify release binary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.get-version.outputs.tag }}
          ASSET: ${{ matrix.asset }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          gh release download "$TAG" --pattern "$ASSET" --pattern SHA256SUMS --dir artifacts
          (cd artifacts && sha256sum --check --ignore-missing SHA256SUMS)
          mkdir -p "npm-platforms/$PLATFORM/bin"
          if [[ "$ASSET" == *.zip ]]; then
            unzip -o "artifacts/$ASSET" -d "npm-platforms/$PLATFORM/bin"
          else
            tar -xzf "artifacts/$ASSET" -C "npm-platforms/$PLATFORM/bin"
          fi
      - name: Validate package and check registry
        id: package
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: node scripts/npm-release.mjs check "npm-platforms/${{ matrix.platform }}"
      - name: Publish platform
        if: steps.package.outputs.publish == 'true'
        working-directory: npm-platforms/${{ matrix.platform }}
        run: pnpm publish --access public --provenance --no-git-checks

  publish-main:
    name: Publish main package
    runs-on: ubuntu-latest
    needs: [get-version, publish-platforms]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.get-version.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/setup@v1
        with:
          version: 12.5.1
          install: false
      - name: Verify every platform is available before publishing wrapper
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: node scripts/npm-release.mjs platforms
      - name: Validate package and check registry
        id: package
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: node scripts/npm-release.mjs check npm
      - name: Publish wrapper
        if: steps.package.outputs.publish == 'true'
        working-directory: npm
        run: pnpm publish --access public --provenance --no-git-checks
